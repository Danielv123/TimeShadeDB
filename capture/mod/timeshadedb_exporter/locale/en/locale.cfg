[mod-setting-name]
timeshade-capture-enabled=Capture enabled
timeshade-capture-debounce=Chart debounce (ticks)
timeshade-capture-chart-reads=Chart reads per tick
timeshade-capture-cache=Sent-chart cache (chunks)
timeshade-capture-rails=Capture rail entities
timeshade-capture-forces=Extra forces to capture
timeshade-capture-panel-gap=Display panel map tag interval (ticks)
timeshade-capture-panel-rate=Display panel map tag changes a minute

[mod-setting-description]
timeshade-capture-enabled=Write capture files to script-output/timeshade. Turning it off stops capture; turning it on again resyncs.
timeshade-capture-debounce=A chunk is read at most once per this many ticks. Higher values collapse flicker (biters, vehicles) at the source.
timeshade-capture-chart-reads=Charted chunks read and compared per tick.
timeshade-capture-cache=How many last-sent charts are kept (about 400 bytes each) to skip unchanged ones. A miss only re-sends an unchanged chart.
timeshade-capture-rails=Also record rail entities (name, position, direction) for the map's rail layer.
timeshade-capture-forces=Comma-separated force names captured even without a player in them. Forces with a player are always captured.
timeshade-capture-panel-gap=A display panel shown on the map records its icon and text at most once per this many ticks, so a panel a circuit changes quickly does not flood the database. The last change is still recorded once the interval is over.
timeshade-capture-panel-rate=How many display panel changes all panels together record a minute at most. Changes held back are recorded later.
