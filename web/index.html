<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>timeShadeDB</title>
    <link rel="icon" href="data:," />
    <script id="tsdb-early">
      // Early start (src/map/boot.ts consumes window.__tsdbEarly): ask the live server for the
      // catalog, and for the first view when the URL names the datastore and the camera, while
      // the bundle downloads. Must compute exactly what boot.ts seedRequest() computes
      // (src/map/boot.test.ts checks this). Static exports skip it (?source=static).
      (function () {
        try {
          var p = new URLSearchParams(location.search);
          if (p.get("source") === "static") return;
          var base = p.get("data") || "/api/v3/";
          if (base.charAt(base.length - 1) !== "/") base += "/";
          var token = p.get("token");
          var headers = token ? { Authorization: "Bearer " + token } : {};
          var get = function (path) {
            return fetch(base + path, { headers: headers, cache: "no-cache" });
          };
          var early = { base: base, catalog: get("catalog"), view: null };
          var map = p.get("map");
          var sfc = p.get("surface");
          var force = p.get("force") || "player";
          var x = Number(p.get("x"));
          var y = Number(p.get("y"));
          var s = Number(p.get("s"));
          if (map && sfc && !p.get("t") && p.get("x") !== null && isFinite(x) && isFinite(y) && s > 0) {
            var esc = function (n) {
              var out = "";
              var b = new TextEncoder().encode(n);
              for (var i = 0; i < b.length; i++) {
                var c = b[i];
                out += (c >= 97 && c <= 122) || (c >= 48 && c <= 57) || c === 95 || c === 45 ? String.fromCharCode(c) : "~" + (c < 16 ? "0" : "") + c.toString(16).toUpperCase();
              }
              return out;
            };
            var z = Math.min(0, Math.max(-10, Math.round(Math.log2(s * (window.devicePixelRatio || 1))))) || 0;
            var span = 512 * Math.pow(2, -z);
            var hw = window.innerWidth / 2 / s;
            var hh = window.innerHeight / 2 / s;
            var bbox = [
              Math.floor((x - hw + 256) / span) - 1,
              Math.floor((y - hh + 256) / span) - 1,
              Math.ceil((x + hw + 256) / span),
              Math.ceil((y + hh + 256) / span)
            ];
            if ((bbox[2] - bbox[0] + 1) * (bbox[3] - bbox[1] + 1) <= 4096) {
              var path = "view/" + esc(map) + "." + esc(sfc) + "." + esc(force) + "/" + z + "?bbox=" + bbox.join(",") + "&t=latest";
              early.view = { path: path, res: get(path) };
            }
          }
          window.__tsdbEarly = early;
        } catch (e) {
          // Start-up falls back to normal requests.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
