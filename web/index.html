<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Static exports set content="static" so start-up skips probing the live API. -->
    <meta name="tsdb-source" content="" />
    <title>timeShadeDB</title>
    <link rel="icon" href="data:," />
    <script id="tsdb-early">
      // Early start (src/map/boot.ts adopts window.__tsdbEarly): fetch the catalog, and the first
      // version answer when the URL names the datastore and the camera, while the bundle
      // downloads. It must request exactly what boot.ts seedRequest()/seedPath() compute
      // (src/map/boot.test.ts checks this).
      (function () {
        try {
          var p = new URLSearchParams(location.search);
          var meta = document.querySelector('meta[name="tsdb-source"]');
          var kind = p.get("source") || (meta && meta.getAttribute("content")) || "server";
          if (kind !== "static") kind = "server";
          var base = p.get("data") || (kind === "static" ? "./" : "/api/v3/");
          if (base.charAt(base.length - 1) !== "/") base += "/";
          var token = p.get("token");
          var headers = token ? { Authorization: "Bearer " + token } : {};
          var get = function (path) {
            return fetch(base + path, { headers: headers, cache: "no-cache" });
          };
          var early = { kind: kind, base: base, catalog: get(kind === "static" ? "catalog.json" : "catalog"), seed: null };
          var num = function (k) {
            var v = p.get(k);
            return v !== null && v.trim() !== "" ? Number(v) : NaN;
          };
          // Datastore: ds, else map + surface + force; scale: s, else 2^z (boot.ts urlDatastore, urlScale).
          var ds = p.get("ds");
          if (ds === null || !/^[^.]+\.[^.]+\.[^.]+$/.test(ds)) ds = null;
          var map = p.get("map");
          var sfc = p.get("surface");
          var force = p.get("force") || "player";
          var x = Number(p.get("x"));
          var y = Number(p.get("y"));
          var s = num("s");
          if (!(s > 0 && isFinite(s))) {
            var zq = num("z");
            s = isFinite(zq) && zq >= -20 && zq <= 10 ? Math.pow(2, zq) : NaN;
          }
          var tRaw = p.get("t");
          var t = tRaw !== null && tRaw !== "" ? Number(tRaw) : null;
          if ((ds || (map && sfc)) && p.get("x") !== null && isFinite(x) && isFinite(y) && s > 0 && (t === null || (isFinite(t) && Math.abs(t) <= 8.64e15))) {
            var esc = function (n) {
              var out = "";
              var b = new TextEncoder().encode(n);
              for (var i = 0; i < b.length; i++) {
                var c = b[i];
                out += (c >= 97 && c <= 122) || (c >= 48 && c <= 57) || c === 95 || c === 45 ? String.fromCharCode(c) : "~" + (c < 16 ? "0" : "") + c.toString(16).toUpperCase();
              }
              return out;
            };
            ds = encodeURIComponent(ds || esc(map) + "." + esc(sfc) + "." + esc(force));
            var z = Math.min(0, Math.max(-10, Math.round(Math.log2(s * (window.devicePixelRatio || 1))))) || 0;
            var path = null;
            if (t !== null || kind === "static") {
              path = "timeline/" + ds + "/" + z + "/" + new Date(t !== null ? t : Date.now()).toISOString().slice(0, 10) + ".json";
            } else {
              var span = 512 * Math.pow(2, -z);
              var hw = window.innerWidth / 2 / s;
              var hh = window.innerHeight / 2 / s;
              var bbox = [
                Math.floor((x - hw + 256) / span) - 1,
                Math.floor((y - hh + 256) / span) - 1,
                Math.ceil((x + hw + 256) / span),
                Math.ceil((y + hh + 256) / span)
              ];
              if ((bbox[2] - bbox[0] + 1) * (bbox[3] - bbox[1] + 1) <= 4096) {
                path = "view/" + ds + "/" + z + "?bbox=" + bbox.join(",") + "&t=latest";
              }
            }
            if (path) early.seed = { path: path, res: get(path) };
          }
          window.__tsdbEarly = early;
        } catch (e) {
          // Start-up falls back to normal requests.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
