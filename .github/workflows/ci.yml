name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Test
        run: go test ./...

      - name: Build package
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: timeshadedb-linux-amd64
          path: build/packages/timeshadedb-linux-amd64.zip
          if-no-files-found: error

      - name: Upload Factorio mod package
        uses: actions/upload-artifact@v4
        with:
          name: timeshadedb-exporter-factorio-mod
          path: build/packages/timeshadedb_exporter_*.zip
          if-no-files-found: error
