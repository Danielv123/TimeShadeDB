name: Release

# After CI passes on master, publishes each artifact whose version is not released yet: the Factorio mod
# (capture/mod/timeshadedb_exporter/info.json) to the Mod Portal, and the Clusterio plugin with its binary packages
# (clusterio/package.json) to npm. Bumping a version is what releases it. Each release is tagged factorio-v<version> or
# clusterio-v<version>. Then a GitHub release gets the mod zip and the timeshadedb binaries. Run it by hand to retry a
# release that failed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The commit CI tested, or the branch head when run by hand.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  plan:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      mod: ${{ steps.mod.outputs.release }}
      mod_version: ${{ steps.mod.outputs.version }}
      npm: ${{ steps.npm.outputs.release }}
      npm_version: ${{ steps.npm.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Factorio mod version on the Mod Portal
        id: mod
        run: |
          set -euo pipefail
          name="$(jq -r .name capture/mod/timeshadedb_exporter/info.json)"
          version="$(jq -r .version capture/mod/timeshadedb_exporter/info.json)"
          # a mod not on the portal yet answers 404 {"message": "Mod not found"}, without releases
          released="$(curl -sS "https://mods.factorio.com/api/mods/${name}" | jq --arg v "$version" '[.releases[]?.version] | index($v) != null')"
          echo "${name} ${version} on the Mod Portal: ${released}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=$([ "$released" = true ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Clusterio plugin version on npm
        id: npm
        run: node clusterio/scripts/publish.mjs --check

  mod:
    needs: plan
    if: needs.plan.outputs.mod == 'true'
    runs-on: ubuntu-latest
    environment: factorio-mod-portal
    permissions:
      contents: write # the release tag
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            capture/test/package-lock.json

      - name: Test the capture
        working-directory: capture/test
        run: npm ci && node run_unit.mjs

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build Factorio mod package
        shell: pwsh
        run: ./scripts/build.ps1 -SkipPackage

      - name: Upload Factorio mod package
        uses: actions/upload-artifact@v4
        with:
          name: timeshadedb_exporter-${{ needs.plan.outputs.mod_version }}
          path: build/packages/timeshadedb_exporter_${{ needs.plan.outputs.mod_version }}.zip
          if-no-files-found: error

      - name: Publish to Factorio Mod Portal
        env:
          FACTORIO_MOD_PORTAL_API_KEY: ${{ secrets.FACTORIO_MOD_PORTAL_API_KEY }}
          MOD_NAME: timeshadedb_exporter
          ZIP_PATH: build/packages/timeshadedb_exporter_${{ needs.plan.outputs.mod_version }}.zip
        run: |
          set -euo pipefail

          # a key pasted into the secret with a trailing newline would break the Authorization header
          key="$(printf '%s' "${FACTORIO_MOD_PORTAL_API_KEY}" | tr -d '[:space:]')"
          if [ -z "${key}" ]; then
            echo "::error::Missing FACTORIO_MOD_PORTAL_API_KEY secret."
            exit 1
          fi

          # POSTs to a portal endpoint (label, URL, curl's form arguments) and prints its response. On an HTTP error
          # it prints the portal's error and message (never the URL: an upload URL carries a token) and fails.
          post() {
            local label="$1" url="$2" out code
            shift 2
            out="$(curl -sS -w '\n%{http_code}' -X POST "${url}" "$@")"
            code="${out##*$'\n'}"
            out="${out%$'\n'*}"
            if [ "${code}" -ge 400 ]; then
              echo "::error::${label}: HTTP ${code}: ${out}" >&2
              return 1
            fi
            printf '%s' "${out}"
          }

          # init_publish creates the mod on the portal, init_upload adds a release to it.
          if curl -fsS -o /dev/null "https://mods.factorio.com/api/mods/${MOD_NAME}"; then
            init=init_upload
            init_url="https://mods.factorio.com/api/v2/mods/releases/init_upload"
          else
            init=init_publish
            init_url="https://mods.factorio.com/api/v2/mods/init_publish"
          fi

          init_response="$(post "${init}" "${init_url}" -H "Authorization: Bearer ${key}" -F "mod=${MOD_NAME}")"
          upload_url="$(jq -r .upload_url <<< "${init_response}")"

          if [ "${init}" = init_publish ]; then
            post finish_upload "${upload_url}" -F "file=@${ZIP_PATH}" \
              -F "description=<capture/mod/README.md" -F "source_url=https://github.com/${GITHUB_REPOSITORY}"
          else
            post finish_upload "${upload_url}" -F "file=@${ZIP_PATH}"
          fi
          echo

      - name: Tag the release
        run: |
          tag="factorio-v${{ needs.plan.outputs.mod_version }}"
          git tag "$tag" "$SHA" && git push origin "$tag"

  npm:
    needs: plan
    if: needs.plan.outputs.npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release tag
      id-token: write # npm trusted publishing
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            clusterio/package-lock.json

      - name: Use an npm with trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Build, test and publish
        working-directory: clusterio
        run: node scripts/publish.mjs --assets ../build/binaries

      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: timeshadedb-${{ needs.plan.outputs.npm_version }}
          path: build/binaries/*
          if-no-files-found: error

      - name: Tag the release
        run: |
          tag="clusterio-v${{ needs.plan.outputs.npm_version }}"
          git tag "$tag" "$SHA" && git push origin "$tag"

  # One GitHub release for the run, on the plugin's tag (the mod's when only the mod was released). It carries the mod
  # zip and the binaries at their current versions: what this run published, the rest from the latest GitHub release,
  # which carries them all.
  github:
    needs: [plan, mod, npm]
    if: always() && needs.plan.result == 'success' && (needs.mod.result == 'success' || needs.npm.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MOD: ${{ needs.mod.result == 'success' }}
      NPM: ${{ needs.npm.result == 'success' }}
      MOD_VERSION: ${{ needs.plan.outputs.mod_version }}
      NPM_VERSION: ${{ needs.plan.outputs.npm_version }}
    steps:
      - name: Download the mod zip
        if: needs.mod.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: timeshadedb_exporter-${{ needs.plan.outputs.mod_version }}
          path: assets

      - name: Download the binaries
        if: needs.npm.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: timeshadedb-${{ needs.plan.outputs.npm_version }}
          path: assets

      - name: Create the GitHub release
        run: |
          set -euo pipefail
          mkdir -p assets
          # the latest release before this one: the start of the generated notes, and where the assets this run did not
          # publish come from
          previous="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          if [ "${MOD}" = true ]; then mod_version="${MOD_VERSION}"; fi
          if [ "${NPM}" = true ]; then npm_version="${NPM_VERSION}"; fi
          if [ -n "${previous}" ] && [ "${MOD}" != true ]; then
            gh release download "${previous}" -D assets -p 'timeshadedb_exporter_*.zip' || true
          fi
          if [ -n "${previous}" ] && [ "${NPM}" != true ]; then
            gh release download "${previous}" -D assets -p 'timeshadedb-*' || true
          fi
          mod_zip="$(ls assets/timeshadedb_exporter_*.zip 2>/dev/null | head -n 1 || true)"
          if [ -n "${mod_zip}" ] && [ -z "${mod_version:-}" ]; then
            mod_version="$(basename "${mod_zip}" .zip)"
            mod_version="${mod_version#timeshadedb_exporter_}"
          fi
          binary="$(ls assets/timeshadedb-* 2>/dev/null | head -n 1 || true)"
          if [ -n "${binary}" ] && [ -z "${npm_version:-}" ]; then
            npm_version="$(basename "${binary}")"
            npm_version="${npm_version#timeshadedb-}"
            npm_version="${npm_version%%-*}"
          fi
          [ -n "${mod_zip}" ] || echo "::warning::No mod zip to attach: the mod was not released by this run or the last GitHub release."
          [ -n "${binary}" ] || echo "::warning::No binaries to attach: the plugin was not released by this run or the last GitHub release."
          (cd assets && sha256sum * > SHA256SUMS)

          if [ "${NPM}" = true ]; then tag="clusterio-v${NPM_VERSION}"; else tag="factorio-v${MOD_VERSION}"; fi
          title=""
          notes=""
          if [ -n "${npm_version:-}" ]; then
            title="timeshade ${npm_version}"
            notes+="- Clusterio plugin: [timeshade ${npm_version}](https://www.npmjs.com/package/timeshade/v/${npm_version}) on npm."$'\n'
            notes+="- The timeshadedb binaries: \`timeshadedb-${npm_version}-<os>-<arch>\`, the server for a single game and the plugin's sidecar."$'\n'
          fi
          if [ -n "${mod_version:-}" ]; then
            title="${title:+${title}, }timeshadedb_exporter ${mod_version}"
            notes+="- Factorio mod: [timeshadedb_exporter ${mod_version}](https://mods.factorio.com/mod/timeshadedb_exporter), also attached as \`timeshadedb_exporter_${mod_version}.zip\`."$'\n'
          fi

          if gh release view "${tag}" > /dev/null 2>&1; then
            gh release upload "${tag}" assets/* --clobber
          else
            start=()
            if [ -n "${previous}" ]; then start=(--notes-start-tag "${previous}"); fi
            gh release create "${tag}" assets/* --verify-tag --title "${title}" --notes "${notes}" --generate-notes "${start[@]}"
          fi
